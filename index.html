<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cafe para dos</title>

    <style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #eaf4fb;
        color: #263746;
        text-align: center;
    }

    .album {
        max-width: 600px;
        margin: auto;
        padding: 40px 20px;
    }

    .cover {
        width: 100%;
        max-width: 400px;
        border-radius: 12px;
    }

    h1 {
        margin-top: 25px;
        margin-bottom: 5px;
        color: #29465a;
    }

    .artist {
        color: #6f8da1;
        margin-bottom: 40px;
    }

    .song {
        background: #f8fcff;
        padding: 20px;
        margin: 15px 0;
        border-radius: 12px;
        text-align: left;
        border: 1px solid #d3e6f2;
        box-shadow: 0 5px 15px rgba(50, 90, 120, 0.08);
    }

    .song-title {
        font-weight: bold;
        margin-bottom: 10px;
        color: #29465a;
    }

    audio {
        width: 100%;
        display: block;
    }

    audio[hidden] {
        display: none;
    }
    </style>
</head>

<body>

    <div class="album">

        <img src="portada.jpeg" class="cover" alt="Portada del álbum">

        <h1>Cafe para dos</h1>

        <div class="artist">
            Nahia
        </div>

        <div class="song">
            <div class="song-title">
                01 · Test Drive
            </div>

            <audio controls preload="metadata">
                <source src="1. Test Drive.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="song">
            <div class="song-title">
                02 · Igande arratsaldeak
            </div>

            <audio controls preload="metadata">
                <source src="2. Igande arratsaldeak.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="song">
            <div class="song-title">
                03 · Como te veo yo
            </div>

            <audio controls preload="metadata">
                <source src="3. Como te veo yo.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="song">
            <div class="song-title">
                04 · No em cal res mes
            </div>

            <audio controls preload="metadata">
                <source src="4. No em cal res mes.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="song">
            <div class="song-title">
                05 · No era un sueño, era verdad
            </div>

            <audio controls preload="metadata">
                <source src="5. No era un sueño, era verdad.mp3" type="audio/mpeg">
            </audio>
        </div>

    </div>

    <script>
        document.querySelectorAll('.song audio').forEach((audio) => {
            const source = audio.querySelector('source');
            if (!source) return;

            const testAudio = new Audio();
            testAudio.preload = 'none';
            testAudio.src = source.src;

            testAudio.addEventListener('error', () => {
                audio.hidden = true;
            }, { once: true });
        });
    </script>

</body>
</html>
